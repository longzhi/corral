[package]
name = "corral"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A capability-based sandbox for untrusted agent skills with fine-grained permission control"
repository.workspace = true
homepage.workspace = true
keywords = ["sandbox", "security", "capabilities", "permissions", "isolation"]
categories = ["command-line-utilities", "development-tools", "os"]
rust-version.workspace = true

[features]
default = ["broker"]
broker = ["tokio/net", "reqwest"]

[dependencies]
corral-core = { path = "../corral-core" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
glob.workspace = true
reqwest = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

nix = { version = "0.27", features = ["process", "signal"] }
libc = "0.2"
url = "2"
async-trait = "0.1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
which = "6"
