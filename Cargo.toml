[workspace]
members = ["corral-core", "corral", "sdk/sandbox-call"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Corral Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/corral"
homepage = "https://github.com/yourusername/corral"
rust-version = "1.70"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
