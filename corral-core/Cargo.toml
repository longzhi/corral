[package]
name = "corral-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core library for Corral - capability-based sandboxing engine"
repository.workspace = true
homepage.workspace = true
keywords = ["sandbox", "security", "capabilities", "permissions", "isolation"]
categories = ["development-tools", "os"]
rust-version.workspace = true

[dependencies]
# Minimal dependencies - no heavy async runtime, no network
tokio = { version = "1", features = ["process", "io-util", "time"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
glob.workspace = true

async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
